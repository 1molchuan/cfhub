# Builds the cfprobe image (docker/Dockerfile) for amd64, arm64 and 32-bit ARM and pushes it to
# ghcr.io/1molchuan/cfprobe, tagged latest and with the release number (releaseSeq). The build log
# prints each binary's sha256; they match the signed release manifest of the same commit.
name: docker

on:
  push:
    branches: [main]
    paths: ["echprobe/**", "docker/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: seq
        run: echo "seq=$(sed -n 's/^const releaseSeq = \([0-9]*\)$/\1/p' echprobe/selfupdate.go)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          provenance: false
          tags: |
            ghcr.io/1molchuan/cfprobe:latest
            ghcr.io/1molchuan/cfprobe:${{ steps.seq.outputs.seq }}
